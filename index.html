<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamun Aleyküm</title>
    <!-- TikTok ikonları için FontAwesome kütüphanesi eklendi -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Turuncu ve mavi karışımı şeffaf/gradyan arka plan */
            background: linear-gradient(135deg, rgba(255, 102, 0, 0.8), rgba(0, 102, 255, 0.8)), 
                        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .link-container {
            margin: 20px 0;
            word-break: break-all;
        }
        .link-container a {
            color: #ffeb3b;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s;
        }
        .link-container a:hover {
            color: #ffffff;
            text-decoration: underline;
        }
        .warning-text {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 20px;
            color: #ffcccc;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        /* TikTok alanı stilleri */
        .tiktok-container {
            margin-top: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1rem;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .tiktok-container i {
            font-size: 1.3rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Selamun Aleyküm</h1>
        <div class="link-container">
            (<a href="https://youtu.be/8hS2Wmblkds?si=HyRK7zEG3C_fyzDr" target="_blank">https://youtu.be/8hS2Wmblkds?si=HyRK7zEG3C_fyzDr</a>)
        </div>
        <div class="warning-text">
            Bu linke tıklamayan apocu.
        </div>
        <!-- TikTok logosu ve kullanıcı adı -->
        <div class="tiktok-container">
            <i class="fa-brands fa-tiktok"></i>
            <span>baro_yedek2</span>
        </div>
    </div>

</body>
</html>
